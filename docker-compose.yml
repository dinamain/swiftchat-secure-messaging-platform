version: '3.9'

services:

  postgres:
    image: postgres:17
    container_name: swiftchat-postgres
    environment:
      POSTGRES_DB: swiftchat
      POSTGRES_USER: swiftchat_user
      POSTGRES_PASSWORD: swiftchat_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: swiftchat-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: